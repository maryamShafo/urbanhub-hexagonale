# TP 4 : Kafka, le service Bruit et le service Notifications (deux groupes).
# Lancer : docker compose -f compose-bruit.yaml up
services:
  kafka:
    image: apache/kafka:3.9.0               # KRaft, un seul noeud, sans ZooKeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNE://:19092,EXTERNE://:9092,CONTROLEUR://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNE://kafka:19092,EXTERNE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNE:PLAINTEXT,EXTERNE:PLAINTEXT,CONTROLEUR:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLEUR
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3                 # tout topic créé : trois partitions

  # Notifications, groupe 1 : prévient les riverains (lit Kafka, et reçoit aussi en HTTP)
  notifications:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - donnees:/donnees
    command: ["node", "urbanhub-notifications/src/principal.ts"]
    environment:
      PORT: "8004"
      KAFKA_BROKERS: kafka:19092
      GROUPE: notifications
      DEPUIS_LE_DEBUT: "oui"                  # un groupe neuf lit le topic depuis le début
      TRAITEES: /donnees/traitees-notifications.json
    ports:
      - "8004:8004"
    depends_on: [kafka]
    restart: on-failure                       # si Kafka n'est pas encore prêt, il relance

  # Notifications, groupe 2 : le même code, un autre groupe (il relit tout le topic de son côté)
  historique:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - donnees:/donnees
    command: ["node", "urbanhub-notifications/src/principal.ts"]
    environment:
      PORT: "8005"
      KAFKA_BROKERS: kafka:19092
      GROUPE: historique
      DEPUIS_LE_DEBUT: "oui"
      TRAITEES: /donnees/traitees-historique.json
    depends_on: [kafka]
    restart: on-failure

  # Bruit qui publie par KAFKA
  bruit-kafka:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - donnees:/donnees
    command: ["node", "urbanhub-bruit/src/principal.ts"]
    environment:
      PORT: "8003"
      BASE_BRUIT: /donnees/bruit-kafka.json
      KAFKA_BROKERS: kafka:19092
    ports:
      - "8003:8003"
    depends_on: [kafka]
    restart: on-failure

  # Bruit qui publie en HTTP vers Notifications (pour comparer pendant la panne)
  bruit-http:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - donnees:/donnees
    command: ["node", "urbanhub-bruit/src/principal.ts"]
    environment:
      PORT: "8006"
      BASE_BRUIT: /donnees/bruit-http.json
      URL_ALERTES: http://notifications:8004/alertes-bruit
    ports:
      - "8006:8006"
    depends_on: [notifications]

volumes:
  donnees: